<br /><br />
<div class="col-md-6 col-md-offset-2">
    <h2>Add Agent</h2>
    <br />
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="agentId">Agent Id:</label>
            <input formControlName="agentId" placeholder="Enter the Agent Id" name="agentId" class="form-control"
                id="agentId">
            <div *ngIf="submitted && addForm.controls.agentId.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.agentId.errors.required">Agent Id is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="agentName">Agent Name:</label>
            <input formControlName="agentName" placeholder="Enter the Agent name" name="agentName" class="form-control"
                id="agentName">
            <div *ngIf="submitted && addForm.controls.agentName.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.agentName.errors.required">Agent Name is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="designation">Designation:</label>
            <input formControlName="designation" placeholder="Enter the Designation" name="designation"
                class="form-control" id="designation">
            <div *ngIf="submitted && addForm.controls.designation.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.designation.errors.required">Designation is required
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="salary">Salary:</label>
            <input formControlName="salary" placeholder="Enter the Salary" name="salary" class="form-control"
                id="salary">
            <div *ngIf="submitted && addForm.controls.salary.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.salary.errors.required">Salary is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea placeholder="Enter the Address" rows="2" formControlName="address" class="form-control"></textarea>
            <div *ngIf="submitted && addForm.controls.address.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.address.errors.required">Address is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email address:</label>
            <input type="email" formControlName="email" placeholder="Enter the Email" name="email" class="form-control"
                id="email">
            <div *ngIf="submitted && addForm.controls.email.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.email.errors.required">Email is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="mobileNo">Mobile Number:</label>
            <input type="mobileNo" formControlName="mobileNo" placeholder="Mobile Number" name="mobileNo"
                class="form-control" id="mobileNo">
            <div *ngIf="submitted && addForm.controls.mobileNo.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.mobileNo.errors.required">Mobile Number is required
                </div>
            </div>
        </div>

        <button class="btn btn-success">Save</button>&nbsp; &nbsp;
        <button class="btn btn-danger" type="reset">Cancel</button>
        &nbsp; &nbsp;
        <a class="btn btn-warning" href="/list-agent">Back to List</a>
        

        <br /><br />
    </form>
</div>
