<br /><br />
<div class="col-md-6 col-md-offset-2">
    <h2>Edit Agent &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </h2>
    <br />
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="agentId">Agent Id:</label>
            <input formControlName="agentId" placeholder="Agent Id" name="agentId" class="form-control" id="agentId">
            <div *ngIf="submitted && editForm.controls.agentId.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.agentId.errors.required">Agent Id is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="agentName">Agent Name:</label>
            <input formControlName="agentName" placeholder="Agent name" name="agentName" class="form-control"
                id="agentName">
            <div *ngIf="submitted && editForm.controls.agentName.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.agentName.errors.required">agentName is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="designation">Designation:</label>
            <input formControlName="designation" placeholder="Designation" name="designation" class="form-control"
                id="designation">
            <div *ngIf="submitted && editForm.controls.designation.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.designation.errors.required">Designation is required
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea placeholder="Enter the Address" rows="2" formControlName="address" class="form-control"></textarea>
            <div *ngIf="submitted && editForm.controls.salary.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.salary.errors.required">Salary is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="salary">Salary:</label>
            <input formControlName="salary" placeholder="Salary" name="salary" class="form-control" id="salary">
            <div *ngIf="submitted && editForm.controls.salary.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.salary.errors.required">Salary is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email address:</label>
            <input type="email" formControlName="email" placeholder="Email" name="email" class="form-control"
                id="email">
            <div *ngIf="submitted && editForm.controls.email.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.email.errors.required">Email is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="mobileNo">Mobile Number:</label>
            <input type="mobileNo" formControlName="mobileNo" placeholder="Mobile Number" name="mobileNo"
                class="form-control" id="mobileNo">
            <div *ngIf="submitted && editForm.controls.mobileNo.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.mobileNo.errors.required">Mobile Number is required
                </div>
            </div>
        </div>

        <button class="btn btn-success">Update</button>&nbsp; &nbsp;
        <a class="btn btn-danger" href="/list-agent">Cancel</a>
        <br /><br />
    </form>
</div>
