<br /><br />
<div class="col-md-6 col-md-offset-2">
    <h2>Add Policy</h2>
    <br />
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="policyId">Policy Id:</label>
            <input formControlName="policyId" placeholder="policyId" name="policyId" class="form-control" id="policyId">
            <div *ngIf="submitted && addForm.controls.policyId.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.policyId.errors.required">Policy Id is required</div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyEffectiveDate">Policy date:</label>
            <input formControlName="policyEffectiveDate" type="date" placeholder="policyEffectiveDate"
                name="policyEffectiveDate" class="form-control" id="policyEffectiveDate">
            <div *ngIf="submitted && addForm.controls.policyEffectiveDate.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.policyEffectiveDate.errors.required">Policydate is
                    required</div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyEndDate">Policy enddate :</label>
            <input formControlName="policyEndDate" type="date" placeholder="policyEndDate" name="policyEndDate"
                class="form-control" id="policyEndDate">
            <div *ngIf="submitted && addForm.controls.policyEndDate.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.policyEndDate.errors.required">Policy enddate is
                    required
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyTerm">Policy term:</label>
            <input formControlName="policyTerm" type="number" placeholder="policyTerm" name="policyTerm"
                class="form-control" id="policyTerm">
            <div *ngIf="submitted && addForm.controls.policyTerm.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.policyTerm.errors.required">Policy term is required
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyStatus">Policy status:</label>
            <input formControlName="policyStatus" placeholder="policyStatus" name="policyStatus" class="form-control"
                id="policyStatus">
            <div *ngIf="submitted && addForm.controls.policyStatus.errors" class="error">
                <div class="text-danger" *ngIf="addForm.controls.policyStatus.errors.required">Policy status is required
                </div>
            </div>
        </div>
        <button class="btn btn-success">Save</button>&nbsp; &nbsp;
        <button class="btn btn-danger" type="reset">Cancel</button>
        &nbsp; &nbsp;
        <a class="btn btn-warning" href="/list-policy">Back to List</a>

        <br /><br />
    </form>
</div>
