<br /><br />
<div class="col-md-6 col-md-offset-2">
    <h2>Edit Policy &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
    </h2>
    <br />
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="policyId">Policy Id:</label>
            <input formControlName="policyId" placeholder="policyId" name="policyId" class="form-control" id="policyId">
            <div *ngIf="submitted && editForm.controls.policyId.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.policyId.errors.required">Policy_Id is required</div>
            </div>
        </div>

        <div class="form-group">
            <label for="policyEffectiveDate">Policy date:</label>
            <input type="date" formControlName="policyEffectiveDate" placeholder="policyEffectiveDate" name="policyEffectiveDate"
                class="form-control" id="policyEffectiveDate">
            <div *ngIf="submitted && editForm.controls.policyEffectiveDate.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.policyEffectiveDate.errors.required">Policy date is
                    required</div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyEndDate">Policy_enddate:</label>
            <input type="date" formControlName="policyEndDate" placeholder="policyEndDate" name="policyEnddate" class="form-control"
                id="policyEndDate">
            <div *ngIf="submitted && editForm.controls.policyEndDate.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.policyEndDate.errors.required">Policy enddate is
                    required
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyTerm">Policy_term:</label>
            <input type="number" formControlName="policyTerm" placeholder="policyTerm" name="policyTerm" class="form-control"
                id="policyTerm">
            <div *ngIf="submitted && editForm.controls.policyTerm.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.policyTerm.errors.required">Policy_term is required
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="policyStatus">Policy_status:</label>
            <input formControlName="policyStatus" placeholder="policyStatus" name="policyStatus" class="form-control"
                id="policyStatus">
            <div *ngIf="submitted && editForm.controls.policyStatus.errors" class="error">
                <div class="text-danger" *ngIf="editForm.controls.policyStatus.errors.required">Policy_status is
                    required</div>
            </div>
        </div>

        <button class="btn btn-success">Update</button>&nbsp; &nbsp;
        <a class="btn btn-danger" href="/list-policy">Cancel</a>
        <br /><br />
    </form>
</div>
